name: smart_bandobast
description: Smart Bandobast System — field officer app (duty check-in + SOS panic button).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  dio: ^5.5.0
  go_router: ^14.2.0
  flutter_secure_storage: ^9.2.2
  geolocator: ^12.0.0
  socket_io_client: ^2.0.3+1
  intl: ^0.19.0
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
